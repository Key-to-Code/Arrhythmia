<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioGuard STM32F401 Telemetry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Header / Title -->
    <header
        class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center bg-slate-800 border border-slate-700 rounded-xl p-4 mb-6 shadow-lg">
        <h1 class="text-2xl font-bold tracking-wide text-cyan-400 mb-2 md:mb-0">CardioGuard STM32F401 Telemetry</h1>

        <!-- Connection Controls -->
        <div class="flex flex-wrap gap-2 items-center">
            <select id="baudSelect"
                class="bg-slate-900 border border-slate-600 text-sm rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-400">
                <option value="115200" selected>115200 (STM32 telemetry)</option>
                <option value="9600">9600 (HC-05 / BT Default)</option>
            </select>
            <button id="connectSerialBtn"
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow">
                Connect MAX30003 Stream
            </button>
        </div>
    </header>

    <!-- Connection Status Banner -->
    <div id="statusBanner"
        class="w-full max-w-5xl text-center font-semibold py-2 mb-4 rounded-lg bg-slate-800 border border-slate-700 text-yellow-400 text-sm">
        Status: Disconnected — click "Connect MAX30003 Stream" to open the STM32 COM port
    </div>

    <!-- Top Metrics Pills (Exact Match to User Photo) -->
    <div class="w-full max-w-5xl flex flex-wrap justify-center gap-6 mb-4">
        <div class="bg-slate-800 border border-slate-600 rounded-xl px-7 py-3 flex items-center gap-2 shadow-lg">
            <span class="text-slate-300 font-semibold text-lg">Heart Rate:</span>
            <span id="hrDisplay" class="text-white font-bold text-lg">-- BPM</span>
        </div>
        <div class="bg-slate-800 border border-slate-600 rounded-xl px-7 py-3 flex items-center gap-2 shadow-lg">
            <span class="text-slate-300 font-semibold text-lg">Status:</span>
            <span id="rhythmDisplay" class="text-emerald-400 font-bold text-lg">WAITING FOR DATA</span>
        </div>
        <div class="bg-slate-800 border border-slate-600 rounded-xl px-7 py-3 flex items-center gap-2 shadow-lg">
            <span class="text-slate-300 font-semibold text-lg">Electrodes:</span>
            <span id="leadOffDisplay" class="text-slate-400 font-bold text-lg">--</span>
        </div>
        <div class="bg-slate-800 border border-slate-600 rounded-xl px-7 py-3 flex items-center gap-2 shadow-lg">
            <span class="text-slate-300 font-semibold text-lg">Overflows:</span>
            <span id="overflowDisplay" class="text-white font-bold text-lg">--</span>
        </div>
    </div>

    <!-- ECG Graph Container -->
    <div class="w-full max-w-5xl bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-2 px-2">
            <span class="text-sm font-semibold text-slate-300">Real-Time ECG Waveform</span>
            <div class="flex gap-4 text-xs items-center">
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-slate-400 inline-block"></span> Raw ECG
                    (mV)</span>
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-cyan-400 inline-block"></span> Filtered
                    ECG (mV)</span>
                <select id="scaleSelect"
                    class="bg-slate-900 border border-slate-600 text-xs rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-400">
                    <option value="2">±2 mV</option>
                    <option value="4" selected>±4 mV</option>
                    <option value="6">±6 mV</option>
                </select>
            </div>
        </div>
        <div class="relative w-full h-80 flex-grow">
            <canvas id="ecgChart"></canvas>
        </div>
    </div>

    <!-- Debug Log Box -->
    <div
        class="w-full max-w-5xl bg-slate-950 border border-slate-800 rounded-xl p-3 mt-4 text-xs font-mono text-slate-400 h-16 overflow-hidden flex flex-col justify-end">
        <span class="text-slate-500">Last incoming line:</span>
        <span id="debugLine" class="text-cyan-300 truncate">None</span>
    </div>

    <!-- Dashboard Logic Script -->
    <script>
        const connectSerialBtn = document.getElementById('connectSerialBtn');
        const baudSelect = document.getElementById('baudSelect');
        const statusBanner = document.getElementById('statusBanner');
        const hrDisplay = document.getElementById('hrDisplay');
        const rhythmDisplay = document.getElementById('rhythmDisplay');
        const leadOffDisplay = document.getElementById('leadOffDisplay');
        const overflowDisplay = document.getElementById('overflowDisplay');
        const scaleSelect = document.getElementById('scaleSelect');
        const debugLine = document.getElementById('debugLine');

        let port = null, reader = null, inputDone = null;
        let incomingBuffer = '';

        function setStatus(text, kind) {
            const styles = {
                info: 'bg-slate-800 border-slate-700 text-yellow-400',
                ok: 'bg-emerald-950 border-emerald-800 text-emerald-400',
                error: 'bg-red-950 border-red-800 text-red-400'
            };
            statusBanner.textContent = 'Status: ' + text;
            statusBanner.className = 'w-full max-w-5xl text-center font-semibold py-2 mb-4 rounded-lg border text-sm ' + styles[kind];
        }

        // Chart.js Configuration
        // Firmware now streams at 128 Hz (every 2nd 256 Hz sample).
        const TELEMETRY_HZ = 128;
        const maxDataPoints = TELEMETRY_HZ * 8; // 8-second scrolling window
        const ctx = document.getElementById('ecgChart').getContext('2d');
        const ecgChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Raw ECG',
                        data: [],
                        borderColor: '#94a3b8', // Gray / Slate Raw ECG
                        borderWidth: 1.0,
                        pointRadius: 0,
                        tension: 0
                    },
                    {
                        label: 'Filtered ECG',
                        data: [],
                        borderColor: '#22d3ee', // Bright Cyan Filtered ECG
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        min: -4.0,
                        max: 4.0,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.12)',
                            lineWidth: 1
                        },
                        ticks: {
                            color: '#94a3b8',
                            stepSize: 1.0,
                            callback: function (v) { return v.toFixed(1); }
                        }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // Vertical range control: keeps large movement artifacts from clipping
        scaleSelect.addEventListener('change', () => {
            const range = parseFloat(scaleSelect.value);
            ecgChart.options.scales.y.min = -range;
            ecgChart.options.scales.y.max = range;
            ecgChart.options.scales.y.ticks.stepSize = range / 4;
            ecgChart.update('none');
        });

        // Redraw at most once per animation frame (messages arrive at 128 Hz)
        let chartUpdatePending = false;
        function scheduleChartUpdate() {
            if (chartUpdatePending) return;
            chartUpdatePending = true;
            requestAnimationFrame(() => {
                chartUpdatePending = false;
                ecgChart.update('none');
            });
        }

        // Web Serial connection straight to the STM32 USART2 telemetry stream.
        // The firmware embeds the MAX30003 ECG samples in its "ECG:" packets,
        // so no Python bridge is involved.
        connectSerialBtn.addEventListener('click', async () => {
            if (!('serial' in navigator)) {
                setStatus('Web Serial not supported. Open this page in Chrome or Edge (file:// or http://localhost).', 'error');
                return;
            }
            if (port) {
                await disconnectSerial();
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                const baudRate = parseInt(baudSelect.value, 10);
                await port.open({ baudRate });

                connectSerialBtn.textContent = 'Disconnect';
                setStatus(`STM32 connected (${baudRate} baud). Waiting for MAX30003 ECG packets...`, 'ok');

                const textDecoder = new TextDecoderStream();
                inputDone = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                readSerialLoop();
            } catch (error) {
                console.error('Serial connection error:', error);
                port = null;
                reader = null;
                inputDone = null;
                connectSerialBtn.textContent = 'Connect MAX30003 Stream';
                setStatus('Connection failed or cancelled. Close MATLAB / ecg_bridge.py if they hold the port.', 'error');
            }
        });

        async function disconnectSerial() {
            const activePort = port;
            const activeReader = reader;
            const activeDone = inputDone;
            port = null;
            reader = null;
            inputDone = null;
            try {
                if (activeReader) await activeReader.cancel();
                if (activeDone) await activeDone.catch(() => { });
            } catch (e) {
                console.warn(e);
            }
            if (activePort) {
                try { await activePort.close(); } catch (e) { console.warn(e); }
            }
            connectSerialBtn.textContent = 'Connect MAX30003 Stream';
            setStatus('Disconnected.', 'info');
        }

        async function readSerialLoop() {
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) handleIncomingData(value);
                }
            } catch (error) {
                console.error('Read error:', error);
            }
            // Stream ended: device unplugged or port closed
            if (port) await disconnectSerial();
        }

        // Packet Parser: Handles both 5-field and 7-field packets:
        // 5-field: ECG:time,raw,filtered,hr,status
        // 7-field: ECG:time,raw,filtered,hr,cls,status,infUs
        function handleIncomingData(chunk) {
            incomingBuffer += chunk;
            let lines = incomingBuffer.split('\n');
            incomingBuffer = lines.pop(); // Keep incomplete trailing fragment

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith("ECG:")) {
                    debugLine.textContent = line;
                    parseAndPlot(line.replace("ECG:", ""));
                }
            }
        }

        function isArrhythmiaActive(status, latched) {
            return status === 1 || latched;
        }

        function parseAndPlot(dataStr) {
            const parts = dataStr.split(',');
            if (parts.length >= 4) {
                const rawVal = parseFloat(parts[1]);
                const filteredVal = parseFloat(parts[2]);
                const hrVal = parseFloat(parts[3]);

                // Determine arrhythmia / rhythm status & class name
                let arrhythmiaStatus = 0;
                let displayStatus = "NORMAL RHYTHM";

                if (parts.length >= 7) {
                    // 7-field: time, raw, filtered, hr, cls, status, infUs
                    const clsName = parts[4].trim();
                    arrhythmiaStatus = parseInt(parts[5]);
                    displayStatus = arrhythmiaStatus === 1 ? `ARRHYTHMIA (${clsName})` : `NORMAL (${clsName})`;
                } else if (parts.length >= 5) {
                    // 5-field: time, raw, filtered, hr, status
                    arrhythmiaStatus = parseInt(parts[4]);
                    displayStatus = arrhythmiaStatus === 1 ? "ARRHYTHMIA DETECTED" : "NORMAL RHYTHM";
                }

                // 9-field: ...,infUs,loff,ovf  (electrode contact + FIFO health)
                if (parts.length >= 9) {
                    const leadOff = parseInt(parts[7], 10);
                    const overflows = parseInt(parts[8], 10);
                    if (!isNaN(leadOff)) {
                        leadOffDisplay.textContent = leadOff ? 'CHECK' : 'OK';
                        leadOffDisplay.className = leadOff
                            ? 'text-red-400 font-bold text-lg animate-pulse'
                            : 'text-emerald-400 font-bold text-lg';
                    }
                    if (!isNaN(overflows)) overflowDisplay.textContent = overflows;
                }

                // Update UI Metrics
                if (!isNaN(hrVal) && hrVal > 0) {
                    hrDisplay.textContent = `${hrVal.toFixed(0)} BPM`;
                }

                // Latch Arrhythmia display for 3.0 seconds so single-beat events are clearly visible
                if (arrhythmiaStatus === 1) {
                    window.lastArrhythmiaTime = Date.now();
                    window.lastArrhythmiaLabel = displayStatus;
                }

                const isLatchedArrhythmia = (window.lastArrhythmiaTime && (Date.now() - window.lastArrhythmiaTime < 3000));

                if (isArrhythmiaActive(arrhythmiaStatus, isLatchedArrhythmia)) {
                    rhythmDisplay.textContent = window.lastArrhythmiaLabel || displayStatus;
                    rhythmDisplay.className = "text-lg font-bold text-red-400 animate-pulse";
                } else {
                    rhythmDisplay.textContent = displayStatus;
                    rhythmDisplay.className = "text-lg font-bold text-emerald-400";
                }

                // Update Chart Data (8-second scrolling window)
                if (!isNaN(rawVal) && !isNaN(filteredVal)) {
                    const labels = ecgChart.data.labels;
                    const rawData = ecgChart.data.datasets[0].data;
                    const filtData = ecgChart.data.datasets[1].data;

                    labels.push('');
                    rawData.push(rawVal);
                    filtData.push(filteredVal);

                    while (rawData.length > maxDataPoints) {
                        labels.shift();
                        rawData.shift();
                        filtData.shift();
                    }

                    scheduleChartUpdate();
                }
            }
        }
    </script>
</body>

</html>
